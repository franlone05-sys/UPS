<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPS Mobile Assistant</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
}

header {
  text-align: center;
  padding: 15px;
  font-size: 20px;
  background: #020617;
}

.container {
  padding: 15px;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 15px;
}

.step {
  font-size: 22px;
  font-weight: bold;
}

.sub {
  font-size: 14px;
  opacity: 0.7;
}

.diagram {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.block {
  padding: 15px;
  border-radius: 10px;
  background: #1e293b;
  text-align: center;
}

.block.active {
  background: #22c55e;
}

.btn {
  width: 100%;
  padding: 18px;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
}

.btn-on { background: #22c55e; }
.btn-off { background: #ef4444; }
.btn-neutral { background: #374151; }

.warning {
  color: #facc15;
  margin-top: 10px;
  font-size: 14px;
}

.progress {
  height: 8px;
  background: #1e293b;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.bar {
  height: 100%;
  background: #22c55e;
  width: 0%;
}
</style>
</head>

<body>

<header>⚡ UPS Mobile Assistant</header>

<div class="container">

<div class="card">
  <div class="step" id="stepText"></div>
  <div class="sub" id="stepCount"></div>
  <div class="warning" id="warning"></div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
</div>

<div class="card diagram">

<div id="input" class="block active">🔌 Entrada</div>
<div id="uib" class="block">UIB</div>
<div id="rectifier" class="block">Rectificador</div>
<div id="inverter" class="block">Inversor</div>
<div id="uob" class="block">UOB</div>
<div id="load" class="block">💻 Carga</div>
<div id="mbb" class="block active">Bypass (MBB)</div>

</div>

<div class="card">

<button class="btn btn-neutral" onclick="action('uib')">UIB</button>
<button class="btn btn-neutral" onclick="action('inverter')">Inversor</button>
<button class="btn btn-neutral" onclick="action('uob')">UOB</button>
<button class="btn btn-neutral" onclick="action('mbb')">MBB</button>

</div>

</div>

<script>
let state = {
  uib:false,
  inverter:false,
  uob:false,
  mbb:true
};

let steps = [
{t:"Cerrar UIB", key:"uib", warn:"Alimentación hacia UPS"},
{t:"Encender inversor", key:"inverter"},
{t:"Cerrar UOB", key:"uob"},
{t:"Abrir MBB (salir de bypass)", key:"mbb_off", warn:"CUIDADO: transferencia a inversor"}
];

let step = 0;

function updateUI(){

let s = steps[step];

document.getElementById("stepText").innerText = s ? s.t : "✅ UPS en modo NORMAL";
document.getElementById("stepCount").innerText = "Paso " + (step+1) + " de " + steps.length;
document.getElementById("warning").innerText = s?.warn || "";

let percent = (step / steps.length)*100;
document.getElementById("bar").style.width = percent + "%";

updateDiagram();
}

function updateDiagram(){

document.getElementById("uib").classList.toggle("active", state.uib);
document.getElementById("inverter").classList.toggle("active", state.inverter);
document.getElementById("uob").classList.toggle("active", state.uob);
document.getElementById("mbb").classList.toggle("active", state.mbb);

let flow = state.uib && state.inverter && state.uob;

document.getElementById("load").classList.toggle("active", flow);
}

function action(key){

if(step >= steps.length) return;

let expected = steps[step].key;

if(expected === key){
  state[key] = true;
  step++;
}
else if(expected === "mbb_off" && key==="mbb"){
  state.mbb = false;
  step++;
}
else{
  alert("⚠️ Acción incorrecta, sigue el procedimiento");
}

updateUI();
}

updateUI();
</script>

</body>
</html>
